name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test NormalizeText.slnx -c Release

      - name: Publish
        run: >-
          dotnet publish src\NormalizeText -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Rename artifact
        shell: pwsh
        run: |
          $publishDir = "src\NormalizeText\bin\Release\net10.0\win-x64\publish"
          $assetName = "normalize-text-${{ steps.version.outputs.version }}-win-x64.exe"
          Copy-Item "$publishDir\normalize-text.exe" $assetName
          "assetName=$assetName" >> $env:GITHUB_OUTPUT
        id: artifact

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create ${{ github.ref_name }}
          "${{ steps.artifact.outputs.assetName }}"
          --title ${{ github.ref_name }}
          --generate-notes
