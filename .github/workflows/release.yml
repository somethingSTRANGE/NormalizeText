name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test NormalizeText.slnx -c Release

      - name: Publish
        run: >-
          dotnet publish src\NormalizeText -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create ${{ github.ref_name }}
          "src\NormalizeText\bin\Release\net10.0\win-x64\publish\normalize-text.exe"
          --title "NormalizeText ${{ steps.version.outputs.version }}"
          --generate-notes
